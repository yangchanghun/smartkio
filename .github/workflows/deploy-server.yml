name: Deploy API server
on:
  push: {branches: [main]}
  workflow_dispatch:
concurrency: {group: smartkio-production, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        env: {SSH_PRIVATE_KEY: '${{ secrets.SSH_PRIVATE_KEY }}', SSH_KNOWN_HOSTS: '${{ secrets.SSH_KNOWN_HOSTS }}'}
        run: |
          install -m 700 -d ~/.ssh
          # Accept PEM text, literal \n sequences, CRLF, or a base64-encoded key.
          printf '%b' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key.input
          if grep -q '^-----BEGIN .*PRIVATE KEY-----' ~/.ssh/deploy_key.input; then
            mv ~/.ssh/deploy_key.input ~/.ssh/deploy_key
          else
            tr -d '[:space:]' < ~/.ssh/deploy_key.input | base64 --decode > ~/.ssh/deploy_key
            rm ~/.ssh/deploy_key.input
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and restart
        env:
          SSH_HOST: '${{ secrets.SSH_HOST }}'
          SSH_PORT: '${{ secrets.SSH_PORT || 22 }}'
          SSH_USER: '${{ secrets.SSH_USER }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.env.production -czf /tmp/smartkio.tgz .
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$GEMINI_API_KEY"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" /tmp/smartkio.tgz "$SSH_USER@$SSH_HOST:/tmp/smartkio.tgz"
          GEMINI_API_KEY_B64="$(printf '%s' "$GEMINI_API_KEY" | base64 -w 0)"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "GEMINI_API_KEY_B64='$GEMINI_API_KEY_B64' bash -s" <<'REMOTE'
          set -eu
          cd /opt/smartkio
          GEMINI_API_KEY="$(printf '%s' "$GEMINI_API_KEY_B64" | base64 --decode)"
          touch .env.production
          if grep -q '^GEMINI_API_KEY=' .env.production; then
            sed -i "s|^GEMINI_API_KEY=.*$|GEMINI_API_KEY=$GEMINI_API_KEY|" .env.production
          else
            printf '\nGEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env.production
          fi
          REMOTE
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/smartkio && tar -xzf /tmp/smartkio.tgz -C /opt/smartkio && cd /opt/smartkio && docker compose -f compose.production.yml up -d --build --remove-orphans'
