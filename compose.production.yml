services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    ports: ["5437:5432"]
    volumes: [smartkio_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./apps/backend
    restart: unless-stopped
    env_file: .env.production
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      db: {condition: service_healthy}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8091:80"]
    volumes: [./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [backend]
volumes:
  smartkio_postgres:
